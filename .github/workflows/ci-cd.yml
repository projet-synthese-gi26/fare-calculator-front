name: Fare Calculator CI/CD

on:
  push:
    branches:
      - "main"
      - "master"
      
jobs:
  pipeline:
    uses: projet-synthese-gi26/workflows/.github/workflows/react-vite-ci-cd.yml@main
    with:
      app_name: fare-calculator-web
      node_version: "20"
      run_lint: true
    secrets:
      PERSONAL_ACCESS_TOKEN:             ${{ secrets.PERSONAL_ACCESS_TOKEN }}
      REGISTRY_NAMESPACE:                ${{ secrets.REGISTRY_NAMESPACE }}
      SSH_PRIVATE_KEY:                   ${{ secrets.SSH_PRIVATE_KEY }}
      REMOTE_USER:                       ${{ secrets.REMOTE_USER }}
      REMOTE_HOST:                       ${{ secrets.REMOTE_HOST }}
      DEPLOY_DELAY:                      ${{ secrets.DEPLOY_DELAY }}
      # ---- Secrets sensibles (repo Settings → Secrets) ----
      VITE_API_KEY:                      ${{ secrets.VITE_API_KEY }}
      VITE_MAPBOX_TOKEN:                 ${{ secrets.VITE_MAPBOX_TOKEN }}
      VITE_FIREBASE_API_KEY:             ${{ secrets.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID:              ${{ secrets.VITE_FIREBASE_APP_ID }}
      # ---- Valeurs non-sensibles (repo Settings → Variables) ----
      VITE_API_BASE_URL:                 ${{ vars.VITE_API_BASE_URL }}
      VITE_MAPBOX_STYLE:                 ${{ vars.VITE_MAPBOX_STYLE }}
      VITE_NOMINATIM_BASE_URL:           ${{ vars.VITE_NOMINATIM_BASE_URL }}
      VITE_OPENMETEO_BASE_URL:           ${{ vars.VITE_OPENMETEO_BASE_URL }}
      VITE_MODE:                         ${{ vars.VITE_MODE }}
      VITE_ENABLE_GEOLOCATION:           ${{ vars.VITE_ENABLE_GEOLOCATION }}
      VITE_CACHE_TTL:                    ${{ vars.VITE_CACHE_TTL }}
      VITE_API_TIMEOUT:                  ${{ vars.VITE_API_TIMEOUT }}
      VITE_GA_ID:                        ${{ vars.VITE_GA_ID }}
      VITE_FIREBASE_AUTH_DOMAIN:         ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID:          ${{ vars.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET:      ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_BILLING_ENABLED:     ${{ vars.VITE_FIREBASE_BILLING_ENABLED }}
 
